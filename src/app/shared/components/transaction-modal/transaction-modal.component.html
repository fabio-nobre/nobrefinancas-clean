<!-- CARD -->
<div style="
  width:100%;
  background:
    linear-gradient(
      180deg,
      #0f172a,
      #111827
    );
  padding:32px;
  color:white;
  overflow:hidden;
  box-sizing:border-box;
">

  <!-- HEADER -->
  <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    ">
    <h2 style="font-size:18px;">
      Nova {{ tipo }}
    </h2>

    <button (click)="fechar()" style="
        background: transparent;
        border: none;
        color: #aaa;
        font-size:18px;
        cursor:pointer;
      ">
      ✕
    </button>
  </div>

  <!-- VALOR -->
  <div style="margin-bottom:20px;">
    <input type="number" [(ngModel)]="valor" placeholder="0,00" style="
          width:100%;
          font-size:36px;
          text-align:center;
          background: transparent;
          border:none;
          outline:none;
          color:white;
        " />
  </div>

  <!-- DESCRIÇÃO -->
  <input [(ngModel)]="descricao" placeholder="Descrição" style="
        width:100%;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        margin-bottom:10px;
        background:#1e293b;
        border:none;
        color:white;
      " />

  <!-- DATA -->
  <input type="date" [(ngModel)]="data" style="
        width:100%;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        margin-bottom:10px;
        background:#1e293b;
        border:none;
        color:white;
      " />

  <!-- CONTA (somente para receita/despesa) -->
  <select *ngIf="tipo !== 'transferencia' && tipo !== 'credito'" [(ngModel)]="conta" style="
        width:100%;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        margin-bottom:10px;
        background:#1e293b;
        color:white;
        border:none;
      ">
    <option *ngFor="let c of contas" [value]="c">
      {{ c }}
    </option>
  </select>

  <!-- CARTÃO (somente quando tipo = credito) -->
  <select *ngIf="tipo === 'credito'" [(ngModel)]="cartao" style="
        width:100%;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        margin-bottom:10px;
        background:#1e293b;
        color:white;
        border:none;
      ">
    <option *ngFor="let c of cartoes" [value]="c">
      {{ c }}
    </option>
  </select>

  <!-- TRANSFERÊNCIA -->
  <div *ngIf="tipo === 'transferencia'" style="
      display:flex;
      gap:10px;
      margin-bottom:10px;
    ">

    <select [(ngModel)]="conta" style="
        flex:1;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        background:#1e293b;
        color:white;
        border:none;
      ">
      <option *ngFor="let c of contas" [value]="c">
        Origem: {{ c }}
      </option>
    </select>

    <select [(ngModel)]="contaDestino" style="
        flex:1;
        padding:10px;
        border-radius:10px;
        background:#1e293b;
        color:white;
        border:none;
      ">
      <option *ngFor="let c of contas" [value]="c">
        Destino: {{ c }}
      </option>
    </select>

  </div>

  <!-- CATEGORIA -->
  <select *ngIf="tipo !== 'transferencia'" [(ngModel)]="categoria" style="
        width:100%;
        padding:10px;
        box-sizing:border-box;
        border-radius:10px;
        margin-bottom:10px;
        background:#1e293b;
        color:white;
        border:none;
      ">
    <option *ngFor="let c of categorias" [value]="c">
      {{ c }}
    </option>
  </select>

  <!-- BOTÃO -->
  <button (click)="salvar()" style="
      margin-top:20px;
      width:100%;
      padding:14px;
      border-radius:12px;
      border:none;
      font-weight:bold;
      background: linear-gradient(90deg, #7c3aed, #9333ea);
      color:white;
      font-size:16px;
      cursor:pointer;
    ">
    Salvar
  </button>

</div>
