<div class="chart-section">


  <div class="chart-section-layout">

    <div class="chart-section-chart">

      @if (hasData) {

      <app-chart [labels]="etiquettes" [data]="data">
      </app-chart>

      } @else {

      <div class="chart-empty-state">
        Sem despesas no período
      </div>

      }

    </div>

    @if (hasData) {

    <div class="chart-section-legend">

      @for (
      item of legendItems;
      track item.label
      ) {

      <div class="legend-item">

        <div class="legend-item-name">
          {{ item.label }}
        </div>

        <div class="legend-item-value">
          {{ item.value | currency:'BRL' }}
        </div>

        <div class="legend-item-percent">
          {{ item.percent }}%
        </div>

      </div>

      }

    </div>
    }

  </div>

</div>
