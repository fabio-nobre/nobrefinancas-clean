<div class="card" style="
  background:#1e293b;
  padding:40px;
  border-radius:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
">

  <h3 style="margin-bottom:20px;">
    📊 Gastos por categoria
  </h3>

  <div style="
    display:flex;
    gap:20px;
    margin-bottom:20px;
    font-size:14px;
  ">

    <span style="color:#22c55e;">
      💰 Receitas:
      {{ receitas | currency:'BRL' }}
    </span>

    <span style="color:#ef4444;">
      💸 Despesas:
      {{ despesas | currency:'BRL' }}
    </span>

  </div>
  <app-chart [labels]="etiquettes" [data]="data">
  </app-chart>

</div>
