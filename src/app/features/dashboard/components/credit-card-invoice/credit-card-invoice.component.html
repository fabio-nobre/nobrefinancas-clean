<div style="
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
">

  <div>

    <h3 style="margin-bottom:20px;">
      💳 Fatura do cartão
    </h3>

    <div *ngFor="
        let item
        of faturaCartao
        | keyvalue
      " style="
        background:#0f172a;
        border-radius:14px;
        padding:16px;
        margin-top:12px;
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">

      <div>
        <strong>
          {{ item.key }}
        </strong>

        <br>

        {{ item.value
        | currency:'BRL' }}
      </div>

      <div style="
    display:flex;
    gap:10px;
    align-items:center;
  ">

        <select [(ngModel)]="
      contaSelecionada[
        item.key
      ]
    " style="
      background:#1e293b;
      color:white;
      border:1px solid #334155;
      border-radius:8px;
      padding:8px;
    ">

          <option [ngValue]="
        undefined
      ">
            Conta
          </option>

          <option *ngFor="
        let conta
        of contas
      " [value]="
        conta
      ">
            {{ conta }}
          </option>

        </select>

        <button [disabled]="
      !contaSelecionada[
        item.key
      ]
    " (click)="
      pagarFatura(
        item.key,
        item.value
      )
    " style="
      background:#22c55e;
      border:none;
      padding:10px 18px;
      border-radius:12px;
      color:white;
      cursor:pointer;
    ">
          Pagar
        </button>

      </div>

    </div>

  </div>

</div>
