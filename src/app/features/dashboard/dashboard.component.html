<!-- FAB -->
<div class="dashboard-fab">

  <!-- MENU -->
  <div *ngIf="menuAberto" class="dashboard-fab-menu">

    <div class="dashboard-fab-menu-item" (click)="abrirModalTipo('despesa')">
      🔻 Despesa
    </div>

    <div class="dashboard-fab-menu-item" (click)="abrirModalTipo('receita')">
      🟢 Receita
    </div>

    <div class="dashboard-fab-menu-item" (click)="abrirModalTipo('credito')">
      💳 Despesa cartão
    </div>

    <div class="dashboard-fab-menu-item" (click)="abrirModalTipo('transferencia')">
      🔁 Transferência
    </div>

  </div>

  <!-- BOTÃO -->
  <button class="dashboard-fab-button" (click)="abrirMenu()">
    +
  </button>

</div>

<!-- CONTAINER -->
<div class="dashboard-container">

  <!-- HEADER -->
  <div class="dashboard-header">

    <button (click)="toggleDarkMode()" class="dashboard-theme-toggle">
      {{ darkMode ? '☀️ Light' : '🌙 Dark' }}
    </button>

    <div class="dashboard-badge">
      💰 Nobre Finanças Premium
    </div>

    <h1 class="dashboard-title">
      Seu patrimônio financeiro
    </h1>

    <p class="dashboard-subtitle">
      Controle financeiro em tempo real
    </p>

  </div>

  <div class="dashboard-month-nav">

    <button class="dashboard-month-button" (click)="mesAnterior()">
      ◀
    </button>

    <strong class="dashboard-month-title">
      {{ dataAtual | date:'MMMM yyyy':'':'pt-BR' }}
    </strong>

    <button class="dashboard-month-button" (click)="proximoMes()">
      ▶
    </button>

  </div>

</div>

<!-- CARDS -->
<app-financial-summary [balance]="saldo" [income]="entradas" [expenses]="saidas">
</app-financial-summary>

<!-- SEGUNDA LINHA -->
<div class="dashboard-secondary-grid">

  <!-- CONTAS -->
  <div class="card dashboard-card dashboard-card-secondary">
    <app-account-summary [saldoPorConta]=" saldoPorConta" />
  </div>

  <!-- METAS -->
  <div class="card dashboard-card dashboard-card-secondary">
    <app-monthly-goal [metaMensal]="metaMensal" [gastoTotal]="gastoTotal" [percentualMeta]="percentualMeta"
      (metaMensalChange)="onMetaMensalChange($event)" />
  </div>

  <!-- RESUMO -->
  <div class="card dashboard-card dashboard-card-secondary">
    <app-monthly-summary [resumo]="resumo" [scoreFinanceiro]="scoreFinanceiro"
      [diagnosticoFinanceiro]="diagnosticoFinanceiro" [topCategoria]="topCategoria">
    </app-monthly-summary>
  </div>
</div>

<div class="dashboard-analytics-grid">

  <!-- GRÁFICO -->
  <div class="card dashboard-card dashboard-card--premium dashboard-card-chart">

    <div class="chart-card-header">

      <div class="chart-card-title">
        📊 Gastos por categoria
      </div>

      <div class="chart-card-filters">

        <select [(ngModel)]="categoriaSelecionada" (change)="recalcular()" class="dashboard-select">

          <option [ngValue]="null">
            Todas categorias
          </option>

          <option *ngFor="
              let c of categorias;
              trackBy: trackByTransaction
            " [value]="c">

            {{ c }}

          </option>

        </select>

        <select [(ngModel)]="contaSelecionada" (change)="onContaChange()" class="dashboard-select">

          <option [ngValue]="null">
            Todas contas
          </option>

          <option *ngFor="
              let c of saldoPorConta | keyvalue;
              trackBy: trackByTransaction
            " [value]="c.key">

            {{ c.key }}

          </option>

        </select>

      </div>
    </div>

    <app-chart-section [receitas]="entradas" [despesas]="saidas" [etiquettes]="etiquettes" [data]="valores">
    </app-chart-section>

  </div>

  <!-- FATURA -->
  <div class="card dashboard-card dashboard-card--premium dashboard-card-invoice">
    <app-credit-card-invoice [faturaCartao]=" faturaCartao" [contas]="contas" (pagar)="
        pagarFatura(
          $event.cartao,
          $event.valor,
          $event.conta
        )
      ">
    </app-credit-card-invoice>
  </div>
</div>
<!-- ÚLTIMAS MOVIMENTAÇÕES -->
<div class="card
      dashboard-card
      dashboard-card-full">

  <h3 class="dashboard-section-title">
    🕒 Últimas movimentações
  </h3>

  <div *ngFor="
          let mov of ultimasMovimentacoes
        " class="dashboard-movement-item">

    <div>
      {{ mov.descricao }}
    </div>

    <div class="dashboard-movement-value" [ngClass]="{
          'dashboard-movement-income': mov.tipo === 'receita',
          'dashboard-movement-expense': mov.tipo !== 'receita'
        }">
      {{ mov.valor | currency:'BRL' }}
    </div>

  </div>

</div>
