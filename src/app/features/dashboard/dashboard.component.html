<!-- FAB -->
<div style="
  position: fixed;
  bottom: 44px;
  right: 44px;
  z-index: 99999;
">

  <!-- MENU -->
  <div *ngIf="menuAberto" style="
    position:absolute;
    bottom:112px;
    right:12px;
    width:260px;
    background:
      rgba(15,23,42,.96);
    backdrop-filter:
      blur(20px);
    border:
      1px solid
      rgba(255,255,255,.05);
    border-radius:28px;
    padding:14px;
    box-shadow:
      0 25px 60px
      rgba(0,0,0,.45);
    overflow:hidden;
    ">

    <div (click)="abrirModalTipo('despesa')" style="
        padding:18px;
        cursor:pointer;
        border-radius:18px;
        transition:.18s;
        font-weight:600;
        font-size:15px;
        color:#e2e8f0;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🔻 Despesa
    </div>

    <div (click)="abrirModalTipo('receita')" style="
        padding:18px;
        cursor:pointer;
        border-radius:18px;
        transition:.18s;
        font-weight:600;
        font-size:15px;
        color:#e2e8f0;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🟢 Receita
    </div>

    <div (click)="abrirModalTipo('credito')" style="
        padding:18px;
        cursor:pointer;
        border-radius:18px;
        transition:.18s;
        font-weight:600;
        font-size:15px;
        color:#e2e8f0;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      💳 Despesa cartão
    </div>

    <div (click)="abrirModalTipo('transferencia')" style="
        padding:18px;
        cursor:pointer;
        border-radius:18px;
        transition:.18s;
        font-weight:600;
        font-size:15px;
        color:#e2e8f0;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🔁 Transferência
    </div>

  </div>

  <!-- BOTÃO -->
  <button (click)="abrirMenu()" onmouseover="
    this.style.transform='scale(1.06)';
    this.style.boxShadow='0 25px 60px rgba(124,58,237,.52),0 0 0 12px rgba(124,58,237,.16)';
    " onmouseout="
    this.style.transform='scale(1)';
    this.style.boxShadow='0 20px 50px rgba(124,58,237,.42),0 0 0 10px rgba(124,58,237,.10)';
    " style="
      width:96px;
      height:96px;
      border:none;
      border-radius:50%;
      background:
      linear-gradient(
      135deg,
      #7c3aed,
      #9333ea
      );
      color:white;
      font-size:54px;
      line-height:1;
      font-weight:300;
      cursor:pointer;

      box-shadow:
      0 28px 70px
      rgba(124,58,237,.42),

      0 0 0 12px
      rgba(124,58,237,.12);

      transition:
      transform .18s ease,
      box-shadow .18s ease;
    ">
    +
  </button>

</div>

<!-- CONTAINER -->
<div style="
  max-width:2600px;
  margin:0 auto;
  padding:24px 32px 80px;
">

  <!-- HEADER -->
  <div style="
    max-width:900px;
    margin:0 auto 72px;
    margin-bottom:72px;
  ">

    <button (click)="toggleDarkMode()" style="
        margin-bottom:12px;
        background:#111827;
        color:white;
        padding:8px 12px;
        border-radius:10px;
        border:none;
        cursor:pointer;
      ">
      {{ darkMode ? '☀️ Light' : '🌙 Dark' }}
    </button>

    <app-page-header title="Dashboard" [subtitle]="labels.subtitle"></app-page-header>

    <div style="
      margin-top:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
    ">

      <button (click)="mesAnterior()">
        ◀
      </button>

      <strong style="font-size:20px;">
        {{ dataAtual | date:'MMMM yyyy':'':'pt-BR' }}
      </strong>

      <button (click)="proximoMes()">
        ▶
      </button>

    </div>

  </div>

  <!-- CARDS -->
  <app-financial-summary [balance]="saldo" [income]="entradas" [expenses]="saidas">
  </app-financial-summary>

  <!-- SEGUNDA LINHA -->
  <div style="
    display:grid;
    grid-template-columns:
      repeat(3, 1fr);
    gap:32px;
    width:100%;
    margin-bottom:32px;
  ">

    <!-- CONTAS -->
    <div class="card" onmouseover="
      this.style.transform='translateY(-4px)';
      this.style.boxShadow='0 20px 50px rgba(0,0,0,.28)';
      " onmouseout="
      this.style.transform='translateY(0)';
      this.style.boxShadow='0 12px 40px rgba(0,0,0,.22)';
" style="background:
      linear-gradient(
      180deg,
      rgba(30,41,59,.92),
      rgba(15,23,42,.96)
      );

      padding:40px;

      border-radius:32px;

      border:
      1px solid
      rgba(255,255,255,.04);

      backdrop-filter:
      blur(18px);

      box-shadow:

      0 12px 40px
      rgba(0,0,0,.22),

      inset 0 1px 0
      rgba(255,255,255,.03);

      min-height:220px;

      transition:
      transform .2s ease,
      box-shadow .2s ease;
  ">
      <app-account-summary [saldoPorConta]="saldoPorConta" />
    </div>

    <div class="card" onmouseover="
      this.style.transform='translateY(-4px)';
      this.style.boxShadow='0 20px 50px rgba(0,0,0,.28)';
      " onmouseout="
      this.style.transform='translateY(0)';
      this.style.boxShadow='0 12px 40px rgba(0,0,0,.22)';
" style="
      background:
      linear-gradient(
      180deg,
      rgba(30,41,59,.92),
      rgba(15,23,42,.96)
      );

      padding:40px;

      border-radius:32px;

      border:
      1px solid
      rgba(255,255,255,.04);

      backdrop-filter:
      blur(18px);

      box-shadow:

      0 12px 40px
      rgba(0,0,0,.22),

      inset 0 1px 0
      rgba(255,255,255,.03);

      min-height:220px;

      transition:
      transform .2s ease,
      box-shadow .2s ease;
  ">
      <app-monthly-goal [metaMensal]="metaMensal" [gastoTotal]="gastoTotal" [percentualMeta]="percentualMeta"
        (metaMensalChange)="onMetaMensalChange($event)" />
    </div>

    <div class="card" onmouseover="
      this.style.transform='translateY(-4px)';
      this.style.boxShadow='0 20px 50px rgba(0,0,0,.28)';
      " onmouseout="
      this.style.transform='translateY(0)';
      this.style.boxShadow='0 12px 40px rgba(0,0,0,.22)';
" style="
      background:
      linear-gradient(
      180deg,
      rgba(30,41,59,.92),
      rgba(15,23,42,.96)
      );

      padding:40px;

      border-radius:32px;

      border:
      1px solid
      rgba(255,255,255,.04);

      backdrop-filter:
      blur(18px);

      box-shadow:

      0 12px 40px
      rgba(0,0,0,.22),

      inset 0 1px 0
      rgba(255,255,255,.03);

      min-height:220px;

      transition:
      transform .2s ease,
      box-shadow .2s ease;
  ">
      <app-monthly-summary [resumo]="resumo" />
    </div>

    <!-- FILTROS -->
    <div style="
      display:flex;
      align-items:center;
      gap:18px;
      margin:36px 0 32px;
    ">

      <span style="
        color:#94a3b8;
        font-size:13px;
        font-weight:600;
      ">
        Filtros
      </span>

      <select [(ngModel)]="categoriaSelecionada" (change)="recalcular()" style="
      height:44px;
      min-width:180px;
      border-radius:14px;
      padding:0 12px;
      background:#0f172a;
      color:#e2e8f0;
      border:1px solid #334155;
      ">
        <option [ngValue]="null">
          Todas categorias
        </option>

        <option *ngFor="let c of categorias; trackBy: trackByTransaction" [value]="c">
          {{ c }}
        </option>
      </select>

      <select [(ngModel)]="contaSelecionada" (change)="onContaChange()" style="
      height:44px;
      min-width:180px;
      border-radius:14px;
      padding:0 12px;
      background:#0f172a;
      color:#e2e8f0;
      border:1px solid #334155;
      ">
        <option [ngValue]="null">
          Todas contas
        </option>

        <option *ngFor="let c of saldoPorConta | keyvalue; trackBy: trackByTransaction " [value]="c.key">
          {{ c.key }}
        </option>
      </select>

    </div>

    <!-- GRÁFICO -->
    <app-chart-section [receitas]="entradas" [despesas]="saidas" [etiquettes]="etiquettes" [data]="valores">
    </app-chart-section>

    <!-- FATURA -->
    <app-credit-card-invoice [faturaCartao]="faturaCartao" [contas]="contas" (pagar)="
        pagarFatura(
          $event.cartao,
          $event.valor,
          $event.conta
        )
      ">
    </app-credit-card-invoice>
  </div>
</div>
