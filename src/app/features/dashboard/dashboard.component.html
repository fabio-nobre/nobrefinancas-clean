<!-- BOTÃO FLUTUANTE -->
<div style="
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 99999;
">

  <!-- MENU -->
  <div *ngIf="menuAberto" style="
      position:absolute;
      bottom:80px;
      right:0;
      width:240px;
      background:#1e293b;
      border-radius:24px;
      padding:12px;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
      overflow:hidden;
    ">

    <div (click)="abrirModalTipo('despesa')" style="
        padding:16px;
        cursor:pointer;
        border-radius:16px;
        transition:.2s;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🔻 Despesa
    </div>

    <div (click)="abrirModalTipo('receita')" style="
        padding:16px;
        cursor:pointer;
        border-radius:16px;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🟢 Receita
    </div>

    <div (click)="abrirModalTipo('credito')" style="
        padding:16px;
        cursor:pointer;
        border-radius:16px;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      💳 Despesa cartão
    </div>

    <div (click)="abrirModalTipo('transferencia')" style="
        padding:16px;
        cursor:pointer;
        border-radius:16px;
      " onmouseover="this.style.background='#2b3648'" onmouseout="this.style.background='transparent'">
      🔁 Transferência
    </div>

  </div>

  <!-- BOTÃO -->
  <button (click)="abrirMenu()" style="
      width:84px;
      height:84px;
      border:none;
      border-radius:50%;
      background:linear-gradient(135deg,#7c3aed,#9333ea);
      color:white;
      font-size:42px;
      cursor:pointer;
      box-shadow:
        0 15px 40px rgba(124,58,237,.45),
        0 0 0 8px rgba(124,58,237,.12);
      transition:.2s;
      backdrop-filter: blur(8px);
    ">
    +
  </button>

</div>

<!-- CONTAINER -->
<div style="
  max-width:2600px;
  margin:0 auto;
  padding:24px 32px 80px;
">

  <!-- HEADER -->
  <div style="
    text-align:center;
    margin-bottom:50px;
  ">

    <button (click)="toggleDarkMode()" style="
        margin-bottom:12px;
        background:#111827;
        color:white;
        padding:8px 12px;
        border-radius:10px;
        border:none;
        cursor:pointer;
      ">
      {{ darkMode ? '☀️ Light' : '🌙 Dark' }}
    </button>

    <app-page-header title="Dashboard" [subtitle]="labels.subtitle"></app-page-header>

    <div style="
      margin-top:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
    ">

      <button (click)="mesAnterior()">
        ◀
      </button>

      <strong style="font-size:20px;">
        {{ dataAtual | date:'MMMM yyyy':'':'pt-BR' }}
      </strong>

      <button (click)="proximoMes()">
        ▶
      </button>

    </div>

  </div>

  <!-- CARDS -->
  <app-financial-summary [balance]="saldo" [income]="entradas" [expenses]="saidas">
  </app-financial-summary>

  <!-- SEGUNDA LINHA -->
  <div style="
    display:grid;
    grid-template-columns:
      repeat(3, 1fr);
    gap:32px;
    width:100%;
    margin-bottom:32px;
  ">

    <!-- CONTAS -->
    <div class="card" style="
    background:#1e293b;
    padding:40px;
    border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    min-height:180px;
  ">
      <app-account-summary [saldoPorConta]="saldoPorConta" />
    </div>

    <div class="card" style="
    background:#1e293b;
    padding:40px;
    border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    min-height:180px;
  ">
      <app-monthly-goal [metaMensal]="metaMensal" [gastoTotal]="gastoTotal" [percentualMeta]="percentualMeta"
        (metaMensalChange)="onMetaMensalChange($event)" />
    </div>

    <div class="card" style="
    background:#1e293b;
    padding:40px;
    border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    min-height:180px;
  ">
      <app-monthly-summary [resumo]="resumo" />
    </div>

    <!-- FILTROS -->
    <div style="
      display:flex;
      align-items:center;
      gap:14px;
      margin:18px 0 24px;
    ">

      <span style="
        color:#94a3b8;
        font-size:13px;
        font-weight:600;
      ">
        Filtros
      </span>

      <select [(ngModel)]="categoriaSelecionada" (change)="recalcular()" style="
      height:44px;
      min-width:180px;
      border-radius:14px;
      padding:0 12px;
      background:#0f172a;
      color:#e2e8f0;
      border:1px solid #334155;
      ">
        <option [ngValue]="null">
          Todas categorias
        </option>

        <option *ngFor="let c of categorias; trackBy: trackByTransaction" [value]="c">
          {{ c }}
        </option>
      </select>

      <select [(ngModel)]="contaSelecionada" (change)="onContaChange()" style="
      height:44px;
      min-width:180px;
      border-radius:14px;
      padding:0 12px;
      background:#0f172a;
      color:#e2e8f0;
      border:1px solid #334155;
      ">
        <option [ngValue]="null">
          Todas contas
        </option>

        <option *ngFor="let c of saldoPorConta | keyvalue; trackBy: trackByTransaction " [value]="c.key">
          {{ c.key }}
        </option>
      </select>

    </div>

    <!-- GRÁFICO -->
    <app-chart-section [receitas]="entradas" [despesas]="saidas" [etiquettes]="etiquettes" [data]="valores">
    </app-chart-section>

    <!-- FATURA -->
    <app-credit-card-invoice [faturaCartao]="faturaCartao" [contas]="contas" (pagar)="
        pagarFatura(
          $event.cartao,
          $event.valor,
          $event.conta
        )
      ">
    </app-credit-card-invoice>
  </div>
</div>
